name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: 앱 (lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  db:
    name: DB (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # DB 컨테이너만 띄워 마이그레이션 적용 후 pgTAP 테스트 (전체 스택보다 빠름)
      - run: npx supabase db start
      - run: npx supabase test db

  deploy-db-staging:
    name: 스테이징 DB 마이그레이션 반영
    needs: [app, db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SUPABASE_STAGING_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: staging
    env:
      # 계정 전체 권한인 액세스 토큰 대신, 스테이징 DB 하나에만 접근 가능한 접속 주소만 사용 (최소 권한)
      # Session pooler 주소 사용 — GitHub 러너는 IPv6 미지원이라 Direct connection 은 실패할 수 있음
      SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
    steps:
      - name: 접속 주소 Secret 확인
        run: |
          if [ -z "$SUPABASE_STAGING_DB_URL" ]; then
            echo "::error::staging 환경에 SUPABASE_STAGING_DB_URL Secret 이 없습니다 (docs/DEPLOYMENT.md C 참고)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase db push --db-url "$SUPABASE_STAGING_DB_URL" --include-all
