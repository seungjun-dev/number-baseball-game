name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: 앱 (lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  db:
    name: DB (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # DB 컨테이너만 띄워 마이그레이션 적용 후 pgTAP 테스트 (전체 스택보다 빠름)
      - run: npx supabase db start
      - run: npx supabase test db

  deploy-db-staging:
    name: 스테이징 DB 마이그레이션 반영
    needs: [app, db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SUPABASE_STAGING_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
      - run: npx supabase db push --include-all
